
name: npc-ai

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-request_yourself_db}
      POSTGRES_USER: ${POSTGRES_USER:-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./models/llm:/models:ro
    command:
      - -m
      - /models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      - --alias
      - Qwen3-4B-Instruct-2507
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "4096"
      - --parallel
      - "1"
      - -t
      - "6"
      - -ngl
      - "0"

  stt:
    image: ghcr.io/ggml-org/whisper.cpp:main
    restart: unless-stopped

    entrypoint: ["whisper-server"]

    ports:
      - "127.0.0.1:8082:8080"

    volumes:
      - ./models/whisper:/models:ro

    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - /models/ggml-base.bin
      - --threads
      - "4"
      - --convert
      - --no-gpu

volumes:
  postgres_data:
